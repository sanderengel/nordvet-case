# Local SQL Server 2022 for the Nordvet pipeline.
#
# Start (password comes from the env file outside the repo, see README):
#   docker compose --env-file ~/.config/nordvet/.env up -d
#
# The amd64 image runs under Rosetta emulation on Apple Silicon
# (Docker Desktop: enable "Use Rosetta for x86_64/amd64 emulation").
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: nordvet-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is not set. Pass --env-file ~/.config/nordvet/.env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - nordvet_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  nordvet_sqldata:
