# Packaging and test config only. Runtime dependencies live in requirements.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nordvet"
version = "0.1.0"
description = "Nordvet no-show pipeline: first slice (Heyra data engineer case)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
